<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Sahanubhuti Foundation Authentic Logo Vector -->
  <defs>
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Top orange embracing arc -->
  <path d="M 137 254 C 137 150, 222 65, 326 65 C 386 65, 439 94, 471 138 C 452 112, 400 87, 342 87 C 248 87, 169 160, 169 254 C 169 295, 183 331, 206 359 L 175 365 C 151 333, 137 295, 137 254 Z" fill="#F37A20" />

  <!-- Blue embracing lower arc and right hand -->
  <g fill="#0099DD">
    <path d="M 328 440 C 378 440, 424 407, 449 358 C 438 375, 404 402, 355 402 C 305 402, 260 376, 237 344 L 202 368 C 234 412, 279 440, 328 440 Z" />
    <!-- Blue wrist and fingers clasped inward -->
    <path d="M 230 330 C 238 318, 255 310, 276 310 L 335 310 C 352 310, 368 322, 375 338 C 385 362, 405 378, 429 385 C 418 392, 402 396, 386 394 C 362 391, 338 377, 318 360 L 260 360 C 244 360, 232 346, 230 330 Z" />
  </g>

  <!-- Orange Hand Clasping from left to right -->
  <g fill="#F37A20">
    <path d="M 172 360 C 180 342, 196 328, 218 325 L 285 325 C 298 325, 308 335, 308 348 C 308 361, 298 371, 285 371 L 225 371 C 205 371, 188 382, 180 398 L 165 388 C 166 378, 168 369, 172 360 Z" />
    <!-- Orange fingers wrapped -->
    <rect x="180" y="380" width="18" height="34" rx="9" transform="rotate(-25 180 380)" fill="#0099DD" />
    <rect x="200" y="392" width="18" height="36" rx="9" transform="rotate(-20 200 392)" fill="#F37A20" />
    <rect x="224" y="400" width="18" height="36" rx="9" transform="rotate(-15 224 400)" fill="#F37A20" />
    <rect x="248" y="404" width="18" height="34" rx="9" transform="rotate(-10 248 404)" fill="#F37A20" />
    <rect x="272" y="402" width="17" height="32" rx="8.5" transform="rotate(-5 272 402)" fill="#F37A20" />
  </g>

  <!-- Central Bengali Logotype Typography: সহানুভূতি ফাউন্ডেশন -->
  <g id="logo-text" class="foundation-text">
    <text x="260" y="240" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif" font-weight="700" font-size="54" letter-spacing="-0.5" fill="#111827">সহানুভূতি</text>
    <text x="260" y="286" text-anchor="middle" font-family="'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif" font-weight="700" font-size="33" letter-spacing="0.5" fill="#111827">ফাউন্ডেশন</text>
  </g>
</svg>
