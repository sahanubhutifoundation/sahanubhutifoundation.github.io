name: Deploy Supabase Edge Function

on:
  push:
    branches:
      - main
    paths:
      - 'supabase/functions/publish-social-preview/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy publish-social-preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy publish-social-preview Edge Function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID || 'oskmpyuofgiivprcojfh' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Required secret SUPABASE_ACCESS_TOKEN is missing in GitHub Actions repository secrets."
            echo "Please add SUPABASE_ACCESS_TOKEN in GitHub Repository Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          echo "Deploying publish-social-preview to project: $SUPABASE_PROJECT_ID"
          supabase functions deploy publish-social-preview --project-ref "$SUPABASE_PROJECT_ID"
